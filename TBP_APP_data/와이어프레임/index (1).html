<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TBP PDS · Hi-Fi Prototype</title>
<style>
:root{
 --navy-950:#04172d;--navy-900:#071E3A;--navy-800:#0B2A4A;--navy-700:#123B63;
 --blue-600:#1546F5;--blue-500:#2D5BFF;--blue-100:#E8EEFF;--blue-50:#F5F7FF;
 --orange:#FF7A1A;--orange-bg:#FFF0E5;--green:#16805D;--green-bg:#EAF7F2;
 --red:#C9362B;--red-bg:#FFF0EE;--amber:#B96800;--amber-bg:#FFF4E5;
 --ink:#111827;--slate:#374151;--muted:#6B7280;--muted2:#9CA3AF;
 --line:#E5E7EB;--line2:#D1D5DB;--soft:#F3F4F6;--bg:#F7F9FC;--white:#fff;
 --shadow:0 12px 34px rgba(7,30,58,.09);--shadow-sm:0 4px 16px rgba(7,30,58,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#eef2f7;color:var(--ink);font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button,a{cursor:pointer}a{text-decoration:none;color:inherit}
.app-shell{width:min(100%,1440px);min-height:100vh;margin:auto;background:var(--bg);display:grid;grid-template-columns:250px 1fr}
.sidebar{background:var(--navy-950);color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 24px}.brand img{width:46px;height:46px;filter:drop-shadow(0 5px 10px #0003)}
.wordmark{font-weight:950;font-style:italic;line-height:.9;letter-spacing:-1px}.wordmark strong{font-size:20px}.wordmark small{display:block;font-size:9px;letter-spacing:2.2px;margin-top:6px;opacity:.85}
.nav-title{font-size:9px;letter-spacing:.16em;color:#7890a9;font-weight:900;margin:10px 12px 8px}
.side-nav{display:grid;gap:5px}.side-nav button{border:0;background:transparent;color:#b7c3d0;border-radius:10px;height:44px;padding:0 12px;display:flex;align-items:center;gap:11px;font-size:13px;font-weight:750;text-align:left}.side-nav button:hover{background:#ffffff0d;color:#fff}.side-nav button.active{background:#ffffff14;color:#fff}.side-nav svg{width:18px;height:18px}
.coach{margin-top:auto;border-top:1px solid #ffffff18;padding:18px 8px 0;display:flex;align-items:center;gap:10px}.coach-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue-500),#5e7bff);font-size:11px;font-weight:900}.coach b{font-size:12px}.coach span{display:block;font-size:10px;color:#8fa3b7;margin-top:2px}
.main{min-width:0}.topbar{height:72px;background:#ffffffd9;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:20}.crumb{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:8px}.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;display:grid;place-items:center;color:var(--navy-800)}.mobile-brand{display:none}
.viewport{padding:28px 32px 110px;max-width:1180px;margin:auto}
.hero-copy{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:22px}.eyebrow{font-size:10px;color:var(--blue-600);font-weight:950;letter-spacing:.12em}.hero-copy h1{font-size:31px;line-height:1.15;letter-spacing:-1.2px;color:var(--navy-900);margin:7px 0 7px}.hero-copy p{font-size:13px;color:var(--muted);margin:0;line-height:1.55}
.primary,.secondary,.ghost,.danger{height:44px;border-radius:9px;padding:0 15px;font-weight:850;font-size:12px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.16s}.primary{background:var(--navy-800);color:#fff}.primary:hover{background:var(--navy-700);transform:translateY(-1px)}.secondary{background:#fff;color:var(--navy-800);border-color:var(--line2)}.secondary:hover{background:var(--soft)}.ghost{background:transparent;color:var(--blue-600)}.danger{background:var(--red-bg);color:var(--red)}
.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:16px}.stack{display:grid;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm)}.card.click{transition:.16s}.card.click:hover{border-color:#c9d3df;box-shadow:var(--shadow);transform:translateY(-1px)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.card h2{font-size:15px;color:var(--navy-900);margin:0}.link{font-size:11px;color:var(--blue-600);font-weight:850}
.next{background:linear-gradient(145deg,var(--navy-900),var(--navy-700));color:#fff;border:0;padding:22px}.next .eyebrow{color:#9db5ff}.next h2{font-size:23px;color:#fff;margin:7px 0}.next p{font-size:12px;color:#c6d0dc}.next .primary{background:#fff;color:var(--navy-900);margin-top:18px}.next-meta{display:flex;gap:18px;margin-top:15px}.next-meta b{font-size:12px}.next-meta span{font-size:9px;color:#8fa3b7;display:block;margin-bottom:3px}
.list{display:grid}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--soft)}.row:first-child{border-top:0;padding-top:0}.row:last-child{padding-bottom:0}.row-main{min-width:0}.title{font-size:13px;font-weight:850;color:var(--ink)}.meta{font-size:10.5px;color:var(--muted);margin-top:4px}.goal{font-size:11.5px;color:var(--slate);margin-top:6px;white-space:normal}.chev{font-size:19px;color:var(--muted2)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;font-size:9px;font-weight:900}.badge.ok{background:var(--green-bg);color:var(--green)}.badge.warn{background:var(--amber-bg);color:var(--amber)}.badge.blue{background:var(--blue-100);color:var(--blue-600)}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:var(--blue-50);border:1px solid #e8ecf7;border-radius:11px;padding:13px}.metric span{font-size:9px;color:var(--muted);font-weight:800}.metric b{display:block;font-size:21px;color:var(--navy-900);margin-top:5px}.progress{height:7px;background:var(--soft);border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue-600),#5577ff);border-radius:inherit}
.search{height:46px;border:1px solid var(--line2);border-radius:10px;background:#fff;display:flex;align-items:center;padding:0 13px;gap:9px;color:var(--muted);font-size:12px}.filters{display:flex;gap:7px;margin:12px 0 16px;flex-wrap:wrap}.chip{height:34px;padding:0 11px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--slate);font-size:11px;font-weight:800}.chip.active{border-color:var(--blue-600);background:var(--blue-100);color:var(--blue-600)}
.player{display:flex;align-items:center;gap:11px}.player-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#e6ebf2,#f8fafc);display:grid;place-items:center;color:var(--navy-800);font-weight:900;font-size:12px;border:1px solid var(--line)}.player-info{flex:1}
.tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:16px}.tab{padding:10px 12px;border:0;background:transparent;font-size:11px;color:var(--muted);font-weight:800;border-bottom:2px solid transparent}.tab.active{color:var(--blue-600);border-color:var(--blue-600)}
.goal-card{background:linear-gradient(135deg,var(--navy-900),#103f6b);color:#fff;border-radius:14px;padding:20px}.goal-card small{font-size:9px;color:#9db5ff;font-weight:900;letter-spacing:.12em}.goal-card h2{color:#fff;font-size:19px;margin:7px 0}.goal-card p{font-size:10px;color:#aebdcc;margin:0}
.skill-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.skill{border:1px solid var(--line);border-radius:10px;padding:12px}.skill span{font-size:10px;color:var(--muted)}.skill b{display:block;font-size:19px;color:var(--blue-600);margin-top:4px}
.form-label{font-size:11px;color:var(--navy-900);font-weight:850;margin:0 0 8px}.skill-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.skill-choice{height:42px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:11px;font-weight:850;color:var(--slate)}.skill-choice.active{border:2px solid var(--blue-600);background:var(--blue-100);color:var(--blue-600)}
textarea{width:100%;min-height:112px;border:1px solid var(--line2);border-radius:9px;padding:12px;resize:vertical;font-size:13px;outline:none}textarea:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-100)}
.quick{display:flex;gap:6px;overflow:auto;margin-bottom:9px}.quick button{white-space:nowrap;border:1px solid var(--line);background:var(--soft);height:31px;padding:0 9px;border-radius:7px;font-size:10px;color:var(--slate);font-weight:750}
.player-strip{display:flex;gap:9px;overflow:auto;padding-bottom:4px}.mini-player{min-width:58px;text-align:center}.mini-avatar{width:38px;height:38px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:2px solid transparent;font-size:10px;font-weight:900}.mini-player.active .mini-avatar{border-color:var(--blue-600);background:var(--blue-100);color:var(--blue-600)}.mini-player.done .mini-avatar{background:var(--green-bg);color:var(--green)}.mini-player small{display:block;font-size:9px;color:var(--muted);margin-top:4px}
.ladder{display:grid;gap:0}.step{display:grid;grid-template-columns:30px 1fr;gap:10px;position:relative;padding-bottom:18px}.step:last-child{padding-bottom:0}.step:not(:last-child):before{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line)}.dot{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line2);display:grid;place-items:center;font-size:9px;z-index:1}.step.done .dot{background:var(--green);border-color:var(--green);color:#fff}.step.now .dot{background:var(--blue-600);border-color:var(--blue-600);color:#fff;box-shadow:0 0 0 4px var(--blue-100)}.step b{font-size:12px}.step p{font-size:11px;color:var(--muted);margin:4px 0 0}
.report-paper{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}.report-paper .brandline{font-size:9px;color:var(--blue-600);font-weight:950;letter-spacing:.15em}.report-paper h2{font-size:25px;margin:7px 0;color:var(--navy-900)}.report-section{margin-top:20px}.report-section h3{font-size:12px;color:var(--navy-800);margin:0 0 7px}.report-section p{font-size:11.5px;line-height:1.65;color:var(--slate);margin:0}.next-goal{background:var(--navy-800);color:#fff;border-radius:10px;padding:14px}.next-goal small{font-size:9px;color:#9db5ff}.next-goal b{display:block;font-size:14px;margin-top:4px}
.bottom-actions{position:fixed;left:250px;right:0;bottom:0;background:#ffffffeb;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 32px;display:flex;justify-content:flex-end;gap:8px;z-index:19}
.mobile-nav{display:none}
.modal-backdrop{position:fixed;inset:0;background:#071e3a66;display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal-backdrop.show{display:flex}.modal{width:min(420px,100%);background:#fff;border-radius:16px;padding:20px;box-shadow:0 25px 70px #071e3a42}.modal h3{margin:0 0 7px;color:var(--navy-900);font-size:17px}.modal p{font-size:12px;color:var(--muted);line-height:1.55}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--navy-900);color:#fff;padding:11px 15px;border-radius:9px;font-size:11px;font-weight:750;opacity:0;pointer-events:none;transition:.2s;z-index:120;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){
 .app-shell{display:block;max-width:430px;min-height:100vh;box-shadow:0 0 40px #071e3a18}.sidebar{display:none}.topbar{height:64px;padding:0 16px}.crumb{display:none}.mobile-brand{display:flex;align-items:center;gap:8px}.mobile-brand img{width:38px;height:38px}.mobile-brand .wordmark strong{font-size:16px}.mobile-brand .wordmark small{font-size:7px}.viewport{padding:20px 16px 145px}.hero-copy{align-items:start}.hero-copy h1{font-size:26px}.hero-copy .primary{display:none}.grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(3,1fr)}.skill-grid{grid-template-columns:repeat(2,1fr)}.bottom-actions{left:50%;transform:translateX(-50%);width:min(430px,100%);bottom:66px;padding:10px 16px}.mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);height:67px;background:#fff;border-top:1px solid var(--line);z-index:30}.mobile-nav button{border:0;background:#fff;color:var(--muted);font-size:9px;font-weight:800}.mobile-nav button svg{display:block;width:18px;height:18px;margin:0 auto 3px}.mobile-nav button.active{color:var(--blue-600)}.report-paper{padding:20px}
}
</style>
</head>
